[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "busybar-mcp"
version = "0.1.2"
description = "An MCP server for the busy bar"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
license-files = ["LICENSE"]
authors = [
    {name = "nuxnik"},
]
dependencies = [
    "busybar-python-sdk>=0.0.1",
    "mcp[cli]>=2.0.0",
]

[project.scripts]
busybar-mcp = "busybar_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
