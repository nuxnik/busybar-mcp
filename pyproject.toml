[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "busybar-mcp"
version = "27.15.0"
description = "An MCP server for the busy bar"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
license-files = ["LICENSE"]
authors = [
    {name = "nuxnik"},
]
dependencies = [
    "busybar-python-sdk>=27.15.0",
    "mcp[cli]>=2.0.0",
]

[project.urls]
repository = "https://github.com/nuxnik/busybar-mcp"

[project.scripts]
busybar-mcp = "busybar_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

# busybar-python-sdk 27.15.0 is in its test phase and is published only on
# Test PyPI. The mapping below pins the SDK to the explicit `testpypi` index
# so `uv lock`/`uv sync`/`uv run` resolve it without manual `--index` flags.
# Remove this block once the SDK is promoted to production PyPI.
[tool.uv.sources]
busybar-python-sdk = { index = "testpypi" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
